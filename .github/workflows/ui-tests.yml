name: UI Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ui-tests-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Run Selenium UI tests (Chrome, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UI tests
        run: |
          pytest \
            --browser=chrome \
            --headless \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml

      - name: Upload test report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            reports/report.html
            reports/junit.xml
            reports/screenshots/
          retention-days: 14
          if-no-files-found: warn
