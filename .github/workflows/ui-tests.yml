name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-tests:
    name: Run Selenium UI tests (${{ matrix.browser }}, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: test_metrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d test_metrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://qa:qa@localhost:5432/test_metrics
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest unit_tests -o log_cli=false
        env:
          RESULTS_FILE: ${{ runner.temp }}/unit-results.json

      - name: Run UI tests
        run: |
          pytest \
            --browser=${{ matrix.browser }} \
            --headless \
            --html=reports/report-${{ matrix.browser }}.html \
            --self-contained-html \
            --junitxml=reports/junit-${{ matrix.browser }}.xml

      - name: Log test results to database
        if: always() && hashFiles('reports/results.json') != ''
        run: python scripts/publish_results.py reports/results.json

      - name: Show stored metrics
        if: always() && hashFiles('reports/results.json') != ''
        run: |
          psql "$DATABASE_URL" -c "SELECT browser, status, exit_status, total, passed, failed, errors, skipped, duration_seconds FROM test_runs ORDER BY id DESC LIMIT 1;"
          psql "$DATABASE_URL" -c "SELECT name, status, duration_seconds FROM test_results ORDER BY id;"

      - name: Upload test report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.browser }}
          path: |
            reports/results.json
            reports/report-*.html
            reports/junit-*.xml
            reports/screenshots/
          retention-days: 14
          if-no-files-found: warn
